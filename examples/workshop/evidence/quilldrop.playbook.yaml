# Case QUILLDROP — fsagen playbook
#
# Synthesizes the triage collection the workshop investigates. Run it seeded so
# every student's evidence is byte-identical. Two runs of this one file make
# the whole corpus: the case tree and the timeline the beats read, and the disk
# image the two-clocks deep dive reads.
#
#   fsagen --seed 88412 --playbook examples/workshop/evidence/quilldrop.playbook.yaml \
#          --on-unsupported=skip \
#          --timeline examples/workshop/case_quilldrop.body \
#          --timeline-format bodyfile --timeline-source modelled \
#          examples/workshop/case
#
#   fsagen --seed 88412 --playbook examples/workshop/evidence/quilldrop.playbook.yaml \
#          --image examples/workshop/case_quilldrop.img --image-fs ntfs \
#          --image-size 64M --image-time 2026-03-12T06:00:00Z
#
# The timeline comes from the first run, never the second: an image's modelled
# timeline adds a $FILE_NAME row per file, and beat 6 would report each of
# those as "in the timeline, not on disk".
#
# PIN THE GENERATOR. This file is written against fsagen v0.4.0. The cookie jar
# (format: chrome_cookies) and the redirect hops in the history (redirect:
# server) are new in that version, and an older one refuses them. Install
# exactly:
#
#   go install github.com/aoiflux/fsagen@v0.4.0
#
# or download the v0.4.0 release binary and check it against its SHA256SUMS.
#
# WHY THE TYPED BLOCKS. fsagen refuses to put filler bytes into a file whose
# extension or name promises a structure, because a .exe full of base32 is
# silent wrong output. So every exhibit the steps parse is built by the action
# or format that makes the real thing -- action: email, pe:, format:
# chrome_history, format: chrome_cookies, format: regf, action: archive -- and
# not by content_len. Everything the steps read is a real RFC 5322 message, a
# real PE, a real SQLite database, a real registry hive and a real zip.
#
# ONE DEVIATION FROM evidence/README.md, deliberate. The contract asked for
# Finance/*.xlsx above 7.9 entropy. A real .xlsx is a deflated zip of XML and
# does not reach 7.9, so the exhibits are Finance/*.xlsx.enc, the shape an
# encrypted spreadsheet actually has on disk, and the contract was corrected to
# match. Beat 1 finds them above its 7.9 floor.
#
# NOT EVERY PLATFORM. The motw action at step 3 writes an alternate data stream,
# which only NTFS has. On a volume without named streams this playbook REFUSES
# and writes nothing unless --on-unsupported=skip is passed, which both build
# scripts do; the timestomp at step 4 needs a settable birth time and is skipped
# the same way. A birth time belongs to the volume, not the operating system:
# where there is none the modelled timeline comes back with every crtime at 0
# and beat 6's "older than its own birth" finding cannot fire, silently.
# Measured on WSL ext4; APFS keeps a birth time and is unmeasured. Generate on
# NTFS, or take the pre-built corpus. The build scripts check the timeline they
# wrote and say so when it happens; evidence/README.md has the measured table
# and says where the pre-built corpus comes from. The disk image is the same
# everywhere: fsagen writes its NTFS itself.
#
# EVERY NAME IS RESERVED. The domains are .example and .test (RFC 2606) and
# the address is from 203.0.113.0/24 (RFC 5737), so nothing in the corpus
# points at a real host.

start: 2026-03-11T09:00:00Z

variables:
  victim: r.mehta
  host: MRD-FIN-07
  c2: 203.0.113.47
  lure: Invoice_MRD-88412
  # One host for the lure link, the Mark-of-the-Web and the browser history, so
  # the three agree and beat 3's correlation is real rather than arranged. It
  # imitates the firm's own domain, meridianlogistics.example.
  lure_host: meridian-logistics-billing.example
  # The ad network the clerk's click went through, and a tracker its ad
  # embedded. The clerk never visited the tracker.
  ad_net: adnet.test
  tracker: px.trackco.test

actors:
  # The clerk's user profile: where the intrusion lands.
  - name: clerk
    base: Users/r.mehta

  # Machine-wide state: the implant's own log directory.
  - name: machine
    base: ProgramData

  # Ordinary business activity. This exists so the students have to FILTER.
  # A signal in a folder of ten files is not a finding, it is a coincidence.
  - name: business
    base: Users/r.mehta/Documents

# ---------------------------------------------------------------------------
steps:

  # -- 0. Background: a normal working week ---------------------------------
  # Generated first so the noise predates the intrusion, the way real noise does.
  - actor: business
    offset: 0m
    every: 22m
    repeat: 40
    actions:
      - action: create
        path: finance/close/wk${SEQ}_ledger.csv
        content_len: 4096
      - action: create
        path: hr/onboarding/emp_${SEQ}.docx
        content_len: 8192

  # -- 0a. The clerk's own hive, as it stood that morning --------------------
  # Three ordinary programs start at logon, one of them installed per user
  # under AppData\Local\Programs, which run_keys's rule flags too: a rule is
  # a question, not a verdict. Explorer hides file extensions, which is why a
  # .pdf.exe looked like a PDF.
  - actor: clerk
    offset: 0m
    actions:
      - action: create
        path: NTUSER.DAT
        format: regf
        registry:
          keys:
            - path: Software\Microsoft\Windows\CurrentVersion\Run
              last_written: 2025-09-15T08:12:40Z
              values:
                - { name: ContosoChat, data: '"C:\Program Files\Contoso\Chat\chat.exe" --minimized' }
                - { name: FabrikamSync, data: '"C:\Program Files (x86)\Fabrikam\Sync\fsync.exe" /background' }
                - { name: NorthwindNotes, data: 'C:\Users\r.mehta\AppData\Local\Programs\Northwind Notes\notes.exe' }
            - path: Software\Microsoft\Windows\CurrentVersion\RunOnce
              last_written: 2026-03-10T17:02:11Z
              values:
                - { name: TailspinCleanup, data: '"C:\Program Files\Tailspin\cleanup.exe" /once' }
            - path: Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
              last_written: 2025-06-02T10:30:00Z
              values:
                - { name: HideFileExt, type: REG_DWORD, data: "1" }

  # -- 0b. The entropy decoys -----------------------------------------------
  # Legitimately encrypted quarterly spreadsheets. Beat 1 reports them beside
  # the operator's archive, which is the lesson: entropy is not a finding.
  - actor: clerk
    offset: 2m
    every: 1m
    repeat: 3
    actions:
      - action: create
        path: Finance/q${ITER}_close.xlsx.enc
        content_len: 65536
        content_kind: bytes

  # -- 1. The lure lands (09:14) --------------------------------------------
  # A real multipart/mixed message. The attachment is named for a PDF and is
  # not one; that double extension is beat 2's first finding.
  - actor: clerk
    offset: 14m
    actions:
      - action: email
        path: Inbox/invoice.eml
        email:
          from: accounts@${VAR:lure_host}
          to: ["r.mehta@meridianlogistics.example"]
          reply_to: billing-desk@${VAR:lure_host}
          subject: "OVERDUE: Invoice MRD-88412 - final notice before referral"
          date: 2026-03-11T09:14:02Z
          message_id: "<88412.quill@${VAR:lure_host}>"
          body_text: |
            Dear Accounts Payable,

            Invoice MRD-88412 is overdue and will be referred for collection
            on Friday. Retrieve the statement here:

                https://${VAR:lure_host}/inv/88412

            Regards,
            Meridian Logistics Billing Desk
          attachments:
            - name: Invoice_MRD-88412.pdf.exe
              content_type: application/vnd.microsoft.portable-executable
              content: |
                This stands in for the attached body. The exhibit the steps
                parse is the file in Downloads, which is a real PE.

  # -- 2. The clerk goes looking for the invoice (09:15) --------------------
  # Wary of the link, the clerk searches for the invoice number instead and
  # clicks the sponsored result at the top. The ad network's own servers
  # redirect the browser twice, onto the very page the email linked: one ad,
  # two hops nobody clicked. ad_redirects walks this chain back from the last
  # visit; the redirect bit is what tells the hops from the click.
  - actor: clerk
    offset: 16m
    actions:
      - action: create
        path: AppData/Local/Google/Chrome/History
        format: chrome_history
        history:
          visits:
            - url: https://meridianlogistics.example/ap/queue
              title: AP queue
              time: 2026-03-11T08:51:00Z
              transition: typed
            - url: https://search.example/?q=meridian+invoice+MRD-88412
              title: meridian invoice MRD-88412 - Search
              time: 2026-03-11T09:15:31Z
              transition: typed
            - url: https://clk.${VAR:ad_net}/c?ad=50513&q=MRD-88412
              time: 2026-03-11T09:16:05Z
              from_visit: 2
            - url: https://rtb.${VAR:ad_net}/r?ad=50513
              time: 2026-03-11T09:16:06Z
              from_visit: 3
              redirect: server
            - url: https://${VAR:lure_host}/inv/88412
              title: Invoice MRD-88412
              time: 2026-03-11T09:16:07Z
              from_visit: 4
              redirect: server
            - url: https://${VAR:lure_host}/inv/88412/download
              title: Download statement
              time: 2026-03-11T09:16:40Z
              from_visit: 5
          downloads:
            - url: https://${VAR:lure_host}/inv/88412/download
              target_path: C:\Users\r.mehta\Downloads\Invoice_MRD-88412.pdf.exe
              start: 2026-03-11T09:16:41Z
              end: 2026-03-11T09:16:44Z
              received_bytes: 36864
              total_bytes: 36864
              mime_type: application/octet-stream
              referrer: https://${VAR:lure_host}/inv/88412
              tab_url: https://${VAR:lure_host}/inv/88412/download
              tab_referrer_url: https://${VAR:lure_host}/inv/88412

  # -- 2b. The cookies that click left behind (09:16) -----------------------
  # Every host on the chain set one, and so did a tracker the ad embedded on
  # the search results: a site that knew the browser was there although the
  # history never went to it. Chrome encrypts the values; the host, name and
  # expiry are not, and they are all ad_cookies needs.
  - actor: clerk
    offset: 16m
    actions:
      - action: create
        path: AppData/Local/Google/Chrome/Cookies
        format: chrome_cookies
        cookies:
          entries:
            - { host: meridianlogistics.example, name: ap_session, value: 7c1e0b2a, created: '2026-03-11T08:51:00Z', secure: true, httponly: true }
            - { host: .search.example, name: prefs, value: 'lang=en-GB&safe=1', created: '2026-02-03T09:00:12Z', expires: '2027-02-03T09:00:12Z', secure: true, samesite: lax }
            - { host: '.${VAR:tracker}', name: px_id, value: 9f3d2c71e4, created: '2026-03-11T09:15:32Z', expires: '2026-06-09T09:15:32Z', secure: true, samesite: none }
            - { host: '.${VAR:ad_net}', name: uid, value: a8e55d0c19b2, created: '2026-03-11T09:16:05Z', expires: '2027-03-11T09:16:05Z', secure: true, samesite: none }
            - { host: 'rtb.${VAR:ad_net}', name: seg, value: 'fin,ap,b2b', created: '2026-03-11T09:16:06Z', expires: '2026-04-10T09:16:06Z', secure: true, samesite: none }
            - { host: '${VAR:lure_host}', name: inv_sess, value: q88412s, created: '2026-03-11T09:16:07Z', secure: true, httponly: true }

  # -- 3. The download (09:17) ----------------------------------------------
  # A real PE wearing a PDF's name, carrying the Mark-of-the-Web that says
  # where it came from. The HostUrl host equals the message's link host.
  - actor: clerk
    offset: 17m
    actions:
      - action: create
        path: Downloads/${VAR:lure}.pdf.exe
        content_len: 36864
        content_kind: bytes
        pe:
          machine: i386
          subsystem: console
          imports:
            - kernel32.dll!WinExec
            - kernel32.dll!CreateFileW
            - urlmon.dll!URLDownloadToFileW
          version:
            file_version: 1.0.0.0
            company_name: Meridian Logistics
            file_description: Invoice Viewer
            original_filename: InvoiceViewer.exe
      - action: motw
        path: Downloads/${VAR:lure}.pdf.exe
        zone_id: 3
        host_url: https://${VAR:lure_host}/inv/88412/download
        referrer_url: https://${VAR:lure_host}/inv/88412

  # -- 4. The implant installs itself (09:20) -------------------------------
  # TimeDateStamp zero: the build date was scrubbed, which is beat 4's finding.
  # Two imported DLLs, so imphash has something to hash.
  - actor: clerk
    offset: 20m
    actions:
      - action: create
        path: AppData/Roaming/MeridianSync/updater.exe
        content_len: 94208
        content_kind: bytes
        pe:
          machine: amd64
          subsystem: gui
          timestamp: 0
          imports:
            - kernel32.dll!CreateFileW
            - kernel32.dll!WriteFile
            - advapi32.dll!RegSetValueExW
            - ws2_32.dll!connect
          version:
            file_version: 10.0.19041.1
            company_name: Meridian Logistics
            file_description: MeridianSync Updater
      # ANTI-FORENSICS, the first. The implant backdates itself to look like
      # it arrived with last autumn's updates. SetFileTime writes
      # $STANDARD_INFORMATION; the $FILE_NAME times stay at 09:20 today. On an
      # NTFS volume that is stomp_two_clocks's finding: a file created before
      # it was given its name.
      - action: timestomp
        path: AppData/Roaming/MeridianSync/updater.exe
        atime: "2025-11-04T10:12:00Z"
        mtime: "2025-11-04T10:12:00Z"
        crtime: "2025-11-04T10:12:00Z"

  # -- 5. Persistence (09:22) -----------------------------------------------
  # The implant adds itself to the clerk's Run key, which moves the key's
  # last-write time to now: run_keys reads that time, and it belongs on beat
  # 5's timeline. The .reg export beside it is what beat 8's critical Sigma
  # rule looks for.
  - actor: clerk
    offset: 22m
    actions:
      - action: update
        path: NTUSER.DAT
        format: regf
        registry:
          keys:
            - path: Software\Microsoft\Windows\CurrentVersion\Run
              last_written: 2026-03-11T09:22:00Z
              values:
                - { name: ContosoChat, data: '"C:\Program Files\Contoso\Chat\chat.exe" --minimized' }
                - { name: FabrikamSync, data: '"C:\Program Files (x86)\Fabrikam\Sync\fsync.exe" /background' }
                - { name: NorthwindNotes, data: 'C:\Users\r.mehta\AppData\Local\Programs\Northwind Notes\notes.exe' }
                - { name: MeridianSync, data: 'C:\Users\r.mehta\AppData\Roaming\MeridianSync\updater.exe' }
            - path: Software\Microsoft\Windows\CurrentVersion\RunOnce
              last_written: 2026-03-10T17:02:11Z
              values:
                - { name: TailspinCleanup, data: '"C:\Program Files\Tailspin\cleanup.exe" /once' }
            - path: Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
              last_written: 2025-06-02T10:30:00Z
              values:
                - { name: HideFileExt, type: REG_DWORD, data: "1" }
      - action: create
        path: AppData/Roaming/persistence.reg
        content: |
          Windows Registry Editor Version 5.00

          [HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run]
          "MeridianSync"="C:\\Users\\r.mehta\\AppData\\Roaming\\MeridianSync\\updater.exe"

  # -- 6. Beaconing, all day (09:25 onward) ---------------------------------
  - actor: machine
    offset: 25m
    every: 30m
    repeat: 28
    actions:
      - action: append
        path: MeridianSync/sync.log
        content: "${DATE:2006-01-02T15:04:05Z07:00} SYNC host=${VAR:host} peer=${VAR:c2}:443 status=OK\n"

  # -- 7. Collection staged (00:00, the small hours) ------------------------
  # Twelve files under one id, so the archive and the deletion can both name
  # exactly these and not a redrawn template.
  - actor: clerk
    offset: 15h
    every: 2s
    repeat: 12
    actions:
      - action: create
        path: AppData/Local/Temp/staging/stg_${ITER}.tmp
        id: staging
        content_len: 32768
        content_kind: bytes

  # -- 8. The archive (00:10) -----------------------------------------------
  # Stored, not deflated, so the members' own high entropy reaches the archive
  # and beat 1 sees it. Members are named by id for the reason above.
  - actor: clerk
    offset: 15h10m
    actions:
      - action: archive
        path: AppData/Local/Temp/bkp_20260311.zip
        archive:
          method: store
          comment: QUILLDROP staging
          base: AppData/Local/Temp/staging
          member_refs:
            - staging

  # -- 9. ANTI-FORENSICS, the second (00:15) --------------------------------
  # The archive's mtime is pushed back to 2024 while its crtime stays at its
  # true 2026 birth: beat 6 reads a file older than itself. Then the staging
  # tree goes, deleted BY ID -- ${ITER} has moved on since those files were
  # created, so repeating the path template would name files that never existed.
  # That is the defect fsagen refused in the shipped playbook (M26-EX-018).
  - actor: clerk
    offset: 15h15m
    actions:
      - action: mace
        path: AppData/Local/Temp/bkp_20260311.zip
        mtime: 2024-07-02T11:00:00Z
      - action: delete
        refs: staging

  # -- 10. Business carries on, oblivious -----------------------------------
  - actor: business
    offset: 16h
    every: 30m
    repeat: 8
    actions:
      - action: create
        path: finance/close/post_incident_${SEQ}.csv
        content_len: 2048
